[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drawing-compare"
version = "0.1.0"
description = "OCR-based GA drawing comparison with evaluation and structured reporting"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Drawing Compare Team" }]
keywords = ["ocr", "drawing", "comparison", "ga", "fastapi"]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "opencv-python-headless>=4.9.0",
    "pymupdf>=1.24.0",
    "rapidfuzz>=3.6.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.6",
    "python-docx>=1.1.0",
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
ocr-tesseract = [
    "pytesseract>=0.3.10",
]
ocr-paddle = [
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.5.0",
]
ocr-windows = [
    "winrt-Windows.Media.Ocr>=3.0.0",
    "winrt-Windows.Graphics.Imaging>=3.0.0",
    "winrt-Windows.Storage>=3.0.0",
    "winrt-Windows.Storage.Streams>=3.0.0",
    "winrt-Windows.Foundation>=3.0.0",
    "winrt-Windows.Foundation.Collections>=3.0.0",
    "winrt-Windows.Globalization>=3.0.0",
]
ocr = [
    "pytesseract>=0.3.10",
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.5.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "types-python-dateutil>=2.8.0",
]

[project.scripts]
drawing-compare-api = "app.main:run"
drawing-compare-eval = "app.evaluation.__main__:main"
drawing-compare-error-analysis = "app.evaluation.error_analysis_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["app.tests*"]

[tool.setuptools.package-data]
app = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "cv2"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fitz"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pytesseract"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "paddleocr"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sentence_transformers"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "qdrant_client"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "qdrant_client.models"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "winrt.windows.media.ocr"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "winrt.windows.graphics.imaging"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "winrt.windows.storage"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "winrt.windows.storage.streams"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["app/tests"]
